title: "Your Rant Blog"
tagline: "Just another opinionated weblog"
author: "Your Name"
description: "Opinions, rants, and occasional sense."
email: ""

# User site: lives at https://indraputrabh.github.io
# baseurl stays empty because the repo is <username>.github.io
url: "https://indraputrabh.github.io"
baseurl: ""

# WordPress-style permalinks: /2026/05/17/post-title/
permalink: /:year/:month/:day/:title/

paginate: 5
paginate_path: "/page:num/"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

# Giscus comments (GitHub Discussions-backed). Free, no ads.
# Comments will start working once the Giscus GitHub App is installed
# on the repo: https://github.com/apps/giscus
giscus:
  repo: "Indraputrabh/Indraputrabh.github.io"
  repo_id: "R_kgDOSiEQjw"
  category: "Announcements"
  category_id: "DIC_kwDOSiEQj84C9ZLe"
  mapping: "pathname"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "light"
  lang: "en"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - node_modules

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
