title: "Your Rant Blog"
tagline: "Just another opinionated weblog"
author: "Your Name"
description: "Opinions, rants, and occasional sense."
email: ""

# User site: lives at https://indraputrabh.github.io
# baseurl stays empty because the repo is <username>.github.io
url: "https://indraputrabh.github.io"
baseurl: ""

# WordPress-style permalinks: /2026/05/17/post-title/
permalink: /:year/:month/:day/:title/

paginate: 5
paginate_path: "/page:num/"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

# Disqus comments. Register a site at https://disqus.com/ and put the
# generated shortname here. Until then, posts show a friendly "comments
# not configured yet" notice. See README.md for the walkthrough.
disqus:
  shortname: "DISQUS_SHORTNAME"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - node_modules

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
