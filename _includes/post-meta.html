{%- assign p = include.post -%}
<p class="post-meta">
  Posted on
  <a href="{{ p.url | relative_url }}" rel="bookmark">
    <time class="entry-date" datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%B %-d, %Y" }}</time>
  </a>
  by <span class="author">{{ p.author | default: site.author }}</span>
  {%- if p.categories and p.categories.size > 0 %}
  in
  {%- for cat in p.categories %}
    <a href="{{ '/categories.html#' | append: cat | slugify | relative_url }}" rel="category">{{ cat }}</a>{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
  {%- endif -%}.
</p>
